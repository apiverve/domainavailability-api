openapi: 3.0.4
info:
  title: Domain Availability
  description: >-
    Domain Availability checks domain availability in real time to show if a web
    address is open for registration or already taken. Get creation and
    expiration dates for taken domains, while paid plans add registrar details
    and what the domain costs to register and renew.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/domainavailability:
    get:
      summary: Domain Availability
      description: Check if a domain is available
      operationId: domainavailability
      parameters:
        - name: domain
          in: query
          schema:
            type: string
          required: true
          description: The domain to check if it is available
          example: myspace.com
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  domain: myspace.com
                  available: false
                  owner:
                    registrar: GoDaddy.com, LLC
                    createdDate: '1996-02-22T05:00:00Z'
                    expiryDate: '2029-02-23T05:00:00Z'
                  source: rdap
                  pricing:
                    tld: com
                    currency: USD
                    registration:
                      low: 11.08
                      high: 11.25
                    renewal:
                      low: 11.08
                      high: 11.25
                    transfer:
                      low: 11.08
                      high: 11.25
                    sources: 2
                    premiumLikely: null
                    premiumReason: null
                    updatedAt: '2026-10-18T10:00:00.000Z'
                  lifecycle: registered
                  eppStatus:
                    - client delete prohibited
                    - client renew prohibited
                    - client transfer prohibited
                    - client update prohibited
                  nameservers:
                    - ns-cloud-a1.googledomains.com
                    - ns-cloud-a2.googledomains.com
                    - ns-cloud-a3.googledomains.com
                    - ns-cloud-a4.googledomains.com
                  isParked: false
                  isForSale: false
                  parkingService: null
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
